# Puzzle71 Technical Debt Repair Configuration
# Version 5.5 - Static configuration only (no runtime device queries)

project:
  name: "Puzzle71 Technical Debt Repair"
  version: "1.0.0"
  description: "GPU-accelerated Bitcoin private key scanner with technical debt repairs"

# System compliance with puzzle71_constraints_v5.5
constitutional:
  version: "5.5"
  static_configuration_only: true
  no_runtime_device_queries: true
  deterministic_replay_required: true

# Deterministic configuration (must be static, no device queries)
deterministic_config:
  # Fixed CUDA launch configuration per architecture
  launch_config:
    # Turing (RTX 20xx series)
    turing:
      block_size: 256
      grid_size: 65535
      shared_memory_size: 32768
      registers_per_thread: 32

    # Ampere (RTX 30xx series)
    ampere:
      block_size: 256
      grid_size: 65535
      shared_memory_size: 49152
      registers_per_thread: 32

    # Ada Lovelace (RTX 40xx series)
    ada_lovelace:
      block_size: 256
      grid_size: 65535
      shared_memory_size: 49152
      registers_per_thread: 32

    # Hopper (H100, H20)
    hopper:
      block_size: 256
      grid_size: 65535
      shared_memory_size: 65536
      registers_per_thread: 32

  # Fixed performance parameters
  performance:
    memory_efficiency_target: 95.0  # % (must be >90%)
    gpu_utilization_target: 80.0    # % (must be >70%)
    synchronization_overhead_max: 50.0  # % of baseline
    occupancy_target: 50.0          # % of theoretical maximum

# ECC Operations Configuration
ecc_operations:
  batch_size: 1000
  use_montgomery: true
  use_fixed_point: true
  precision_target: 1e-10  # Required for CPU/GPU consistency

  # Memory optimization
  memory_layout: "structure_of_arrays"  # Must be SoA for coalescing
  alignment: 128  # bytes
  shared_memory_optimization: true

  # Validation requirements
  cpu_reference_required: true
  validation_cases: 10000  # Minimum validation cases
  random_validation_seed: 12345

# Technical Debt Repair Configuration
techdebt_repair:
  # User Story 1: Core Technical Debt Resolution
  core_repairs:
    enable_ecc_operations_fixed: true
    enable_legacy_adapter_fixed: true
    enable_static_launch_config: true
    enable_config_validator: true

  # User Story 2: Performance Validation and Optimization
  performance_optimization:
    enable_unified_candidate_scanner: true
    enable_optimized_memory_access: true
    enable_adaptive_gpu_utilization: true
    enable_warp_level_primitives: true

  # User Story 4: Integration Testing and Validation
  validation_system:
    enable_ecc_validation: true
    enable_deterministic_replay: true
    enable_constitutional_compliance: true
    enable_performance_regression_detection: true

# Validation and Testing Configuration
validation:
  # CPU/GPU consistency validation
  ecc_validation:
    enabled: true
    precision_threshold: 1e-10
    max_validation_cases: 100000
    failure_tolerance: 0  # Zero tolerance for validation failures

  # Deterministic replay validation
  replay_validation:
    enabled: true
    replay_count: 5
    seed_determinism: true
    checksum_validation: true

  # Constitutional compliance validation
  constitutional_compliance:
    enabled: true
    constraint_version: "5.5"
    strict_mode: true
    violation_tolerance: 0  # Zero tolerance for violations

  # Performance regression detection
  performance_regression:
    enabled: true
    baseline_protection: "sha256"
    regression_threshold: 5.0  # % performance degradation
    automatic_baseline_update: false

# Memory Management Configuration
memory:
  # Structure-of-Arrays layout (required for coalescing)
  soa_layout:
    enabled: true
    padding_bytes: 4
    alignment_bytes: 128

  # Shared memory optimization
  shared_memory:
    enabled: true
    bank_conflict_elimination: true
    padding_factor: 17  # Coprime with 32 bank count

  # Global memory optimization
  global_memory:
    coalescing_enabled: true
    cache_optimization: true
    bandwidth_efficiency_target: 90.0  # %

# Performance Benchmarking Configuration
benchmarking:
  # Baseline management
  baselines:
    storage_format: "json"
    sha256_protection: true
    version_control: true
    automatic_backup: true

  # Benchmark execution
  execution:
    duration_seconds: 600  # 10 minutes
    sampling_interval: 30  # seconds
    warmup_samples: 2
    min_samples: 20

  # Performance targets
  targets:
    rtx_2080_ti: 1000000000  # 1.0 Gkeys/s
    rtx_3090:     2000000000  # 2.0 Gkeys/s
    h20:          3500000000  # 3.5 Gkeys/s
    a100:         4000000000  # 4.0 Gkeys/s

# Logging and Monitoring Configuration
logging:
  level: "INFO"
  format: "json"
  output:
    console: true
    file: true
    file_path: "logs/techdebt_repair.log"
    max_file_size_mb: 100
    max_files: 10

  # Performance logging
  performance_logging:
    enabled: true
    interval_seconds: 60
    include_gpu_metrics: true
    include_memory_metrics: true

  # Validation logging
  validation_logging:
    enabled: true
    log_failures: true
    log_passes: false
    detailed_metrics: true

# Integration System Configuration
integration:
  # Third-party library integration
  libraries:
    secp256k1:
      required: true
      version_constraint: ">=0.1.0"
      cpu_reference: true

    openssl:
      required: true
      version_constraint: ">=1.1.0"

    nlohmann_json:
      required: true
      version_constraint: ">=3.9.0"

    gtest:
      required: true
      version_constraint: ">=1.12.0"

  # Dependency management
  dependency_management:
    auto_update: false
    security_scanning: true
    version_tracking: true
    attribution_validation: true

# Security Configuration
security:
  # Cryptographic security
  crypto:
    no_reimplementation: true  # Must use existing implementations
    constant_time_operations: true
    side_channel_protection: true

  # Input validation
  input_validation:
    strict_mode: true
    range_validation: true
    format_validation: true
    sanitization_enabled: true

  # Operational security
  operational:
    sha256_protected_files: true
    audit_trail: true
    access_control: true

# Error Handling Configuration
error_handling:
  # Fatal errors (immediate termination)
  fatal_errors:
    - "constitutional_violation"
    - "validation_failure"
    - "crypto_reimplementation_detected"
    - "static_configuration_violation"

  # Warning conditions (log but continue)
  warnings:
    - "performance_below_target"
    - "gpu_utilization_low"
    - "memory_efficiency_below_target"
    - "configuration_deprecated"

  # Retry configuration
  retry:
    max_attempts: 3
    backoff_factor: 2.0
    timeout_seconds: 300

# Development and Debug Configuration
development:
  # Debug features
  debug:
    enabled: false  # Must be false for production
    verbose_logging: false
    memory_debugging: false
    kernel_debugging: false

  # Development tools
  tools:
    profiling_enabled: false
    benchmarking_enabled: true
    validation_enabled: true

  # Test configuration
  testing:
    unit_tests_enabled: true
    integration_tests_enabled: true
    performance_tests_enabled: true
    regression_tests_enabled: true

# Production Deployment Configuration
production:
  # Deployment settings
  deployment:
    self_contained: true
    minimal_dependencies: true
    offline_mode: false

  # Performance settings
  performance:
    maximum_performance: true
    resource_limits:
      max_memory_mb: 8192
      max_cpu_cores: 16
      max_gpu_memory_percent: 90

  # Monitoring
  monitoring:
    health_checks: true
    performance_monitoring: true
    error_tracking: true
    alerting: false