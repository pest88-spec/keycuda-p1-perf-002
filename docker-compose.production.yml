# Puzzle71 CUDA Technical Debt Repair System - Production Docker Compose v3.0
# T080: Create deployment scripts and Docker production images
# Production-ready orchestration with monitoring, logging, and persistence

version: '3.8'

services:
  # Main Puzzle71 Solver Service
  puzzle71-solver:
    image: puzzle71-solver:3.0.0
    container_name: puzzle71-solver
    restart: unless-stopped

    # Security configuration
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    # Environment configuration
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PUZZLE71_ENV=production
      - LOG_LEVEL=INFO
      - TZ=UTC
      - GPU_UTILIZATION_TARGET=90
      - MEMORY_EFFICIENCY_TARGET=95

    # Volume mounts
    volumes:
      - ./config:/opt/puzzle71/config:ro
      - ./data:/opt/puzzle71/data:ro
      - ./results:/opt/puzzle71/results:rw
      - ./logs:/opt/puzzle71/logs:rw
      - ./monitoring:/opt/puzzle71/monitoring:rw

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '8'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Command configuration
    command: >
      --config /opt/puzzle71/config/production.yaml
      --keyspace-file /opt/puzzle71/data/private_ranges.txt
      --target-addresses /opt/puzzle71/data/target_addresses.txt
      --output /opt/puzzle71/results/puzzle71_results.json
      --log-file /opt/puzzle71/logs/puzzle71.log
      --daemon
      --monitoring-port 8080

    # Health check
    healthcheck:
      test: ["CMD", "/opt/puzzle71/health_check.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Networking
    networks:
      - puzzle71-network
    ports:
      - "8080:8080"  # Monitoring port

    # Dependencies
    depends_on:
      - redis
      - prometheus

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: puzzle71-redis
    restart: unless-stopped

    # Security configuration
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    # Environment
    environment:
      - TZ=UTC

    # Volume mounts
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro

    # Command
    command: redis-server /usr/local/etc/redis/redis.conf

    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

    # Networking
    networks:
      - puzzle71-network
    ports:
      - "6379:6379"

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: puzzle71-prometheus
    restart: unless-stopped

    # Security configuration
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    # Environment
    environment:
      - TZ=UTC

    # Volume mounts
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    # Command
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Networking
    networks:
      - puzzle71-network
    ports:
      - "9090:9090"

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: puzzle71-grafana
    restart: unless-stopped

    # Security configuration
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    # Environment
    environment:
      - TZ=UTC
      - GF_SECURITY_ADMIN_PASSWORD=puzzle71_admin_password
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource

    # Volume mounts
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Networking
    networks:
      - puzzle71-network
    ports:
      - "3000:3000"

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

    # Dependencies
    depends_on:
      - prometheus

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: puzzle71-node-exporter
    restart: unless-stopped

    # Security configuration
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - SYS_TIME

    # Command
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

    # Volume mounts
    volumes:
      - '/:/host:ro,rslave'

    # Networking
    networks:
      - puzzle71-network
    ports:
      - "9100:9100"

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

# Network configuration
networks:
  puzzle71-network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volume definitions
volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local