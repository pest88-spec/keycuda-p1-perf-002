# Kernel Architecture Performance CI
#
# OpenSpec: unify-kernel-execution-paths
# Task: 1.1.3 - Integrate to CI pipeline
#
# This workflow runs kernel architecture comparison benchmarks on every push
# and Pull Request to detect performance regressions early.

name: Kernel Architecture Performance

on:
  push:
    branches: [ main, 001-specify-scripts-bash, 'feature/**' ]
    paths:
      - 'src/puzzle71_kernel.cu'
      - 'src/kernels/ecc_kernel.cu'
      - 'src/kernels/hash_kernel.cu'
      - 'tests/performance/kernel_architecture_comparison.cpp'
      - '.github/workflows/kernel_architecture_performance.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/puzzle71_kernel.cu'
      - 'src/kernels/ecc_kernel.cu'
      - 'src/kernels/hash_kernel.cu'
      - 'tests/performance/kernel_architecture_comparison.cpp'

jobs:
  benchmark:
    name: Kernel Architecture Benchmarks
    runs-on: self-hosted  # Requires GPU-equipped runner

    strategy:
      matrix:
        architecture: [fused, separated_ecc, separated_hash, separated_full]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.11
        with:
          cuda: '11.8.0'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libsecp256k1-dev \
            libssl-dev \
            nlohmann-json3-dev \
            jq

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON \
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90"

      - name: Build project
        run: |
          cd build
          make -j$(nproc)

      - name: Check CUDA device
        run: |
          nvidia-smi
          nvidia-smi --query-gpu=name,compute_cap --format=csv

      - name: Create benchmark output directory
        run: |
          mkdir -p benchmark_results
          mkdir -p benchmark_results/archive

      - name: Run kernel architecture benchmarks
        run: |
          ./scripts/benchmark/run_kernel_architecture_benchmarks.sh \
            --output-dir benchmark_results \
            --iterations 10

      - name: Compare with baseline
        id: comparison
        run: |
          # Check if baseline exists
          BASELINE_FILE="benchmarks/baselines/kernel_architecture_baseline.json"

          if [[ -f "${BASELINE_FILE}" ]]; then
            echo "Baseline found, comparing results..."

            # Extract current throughput for each architecture
            FUSED_CURRENT=$(jq -r '.keys_per_second' benchmark_results/fused_architecture.json)
            FUSED_BASELINE=$(jq -r '.fused.keys_per_second' ${BASELINE_FILE})

            # Calculate percentage difference
            FUSED_DIFF=$(echo "scale=2; (($FUSED_CURRENT - $FUSED_BASELINE) / $FUSED_BASELINE) * 100" | bc)

            echo "fused_diff=${FUSED_DIFF}" >> $GITHUB_OUTPUT

            # Check for regression (>5% slower)
            if (( $(echo "$FUSED_DIFF < -5.0" | bc -l) )); then
              echo "regression_detected=true" >> $GITHUB_OUTPUT
              echo "::error::Performance regression detected in fused architecture: ${FUSED_DIFF}%"
            else
              echo "regression_detected=false" >> $GITHUB_OUTPUT
              echo "::notice::Performance change in fused architecture: ${FUSED_DIFF}%"
            fi
          else
            echo "No baseline found, establishing new baseline"
            echo "regression_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: kernel-architecture-benchmarks-${{ matrix.architecture }}
          path: |
            benchmark_results/*.json
            benchmark_results/*.txt
          retention-days: 30

      - name: Archive results
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          cp -r benchmark_results benchmark_results/archive/${TIMESTAMP}_${{ matrix.architecture }}

      - name: Fail on regression
        if: steps.comparison.outputs.regression_detected == 'true'
        run: |
          echo "::error::Performance regression detected! Check benchmark results."
          exit 1

  generate-report:
    name: Generate Comparison Report
    needs: benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v3
        with:
          path: benchmark_results

      - name: Generate comprehensive report
        run: |
          cat > benchmark_results/CI_REPORT.md << 'EOF'
          # Kernel Architecture Performance Report

          ## Summary
          This report compares the performance of three kernel execution architectures:

          1. **Fused Architecture** (puzzle71_kernel.cu)
          2. **Separated ECC** (ecc_kernel.cu)
          3. **Separated Hash** (hash_kernel.cu)
          4. **Separated Full Pipeline** (ECC + Hash)

          ## Results

          | Architecture | Throughput (keys/sec) | Registers/Thread | Occupancy (%) | Launch Overhead (μs) |
          |-------------|----------------------|------------------|---------------|---------------------|
          | Fused | TBD | TBD | TBD | TBD |
          | Separated ECC | TBD | TBD | TBD | TBD |
          | Separated Hash | TBD | TBD | TBD | TBD |
          | Separated Full | TBD | TBD | TBD | TBD |

          ## Recommendations

          Based on the benchmark results, we recommend:

          - [ ] Performance target achieved (10-20% improvement)
          - [ ] Register usage within target (<40 registers/thread)
          - [ ] GPU occupancy acceptable (>50%)
          - [ ] No performance regressions detected

          ## Next Steps

          1. Review detailed results in artifacts
          2. Update baseline if performance improved
          3. Proceed with migration phases if targets met
          EOF

          echo "Report generated: benchmark_results/CI_REPORT.md"

      - name: Upload comparison report
        uses: actions/upload-artifact@v3
        with:
          name: kernel-architecture-comparison-report
          path: benchmark_results/CI_REPORT.md
          retention-days: 90

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('benchmark_results/CI_REPORT.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
